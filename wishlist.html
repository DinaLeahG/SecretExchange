<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wish Lists</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css?v=23">
  <style>
    .wl { max-width: 680px; margin: 0 auto; padding: 40px 16px 64px; display: grid; gap: 20px; }
    .wl-head { display: grid; gap: 10px; }
    .wl-head h1 { font-size: 28px; font-weight: 600; letter-spacing: -.02em; }
    .add-form { display: grid; gap: 10px; padding: 14px 16px 16px; border-top: 1px solid var(--line); background: #fafaf8; }
    .add-form .two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
    .add-form textarea { min-height: 56px; }
    .add-form .actions { display: flex; gap: 8px; justify-content: flex-end; }
    .list-foot { padding: 8px 16px 12px; border-top: 1px solid var(--line); }
    .list-person .you { font-weight: 400; color: var(--muted); font-size: 13px; margin-left: 6px; }
    .lists { display: grid; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
    .list-person { border-top: 1px solid var(--line); }
    .list-person:first-child { border-top: 0; }
    .list-person summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; font-weight: 600; }
    .list-person summary::-webkit-details-marker { display: none; }
    .list-person[open] summary { border-bottom: 1px solid var(--line); background: #fafaf8; }
    .items { list-style: none; margin: 0; padding: 0; }
    .item { display: flex; justify-content: space-between; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line); }
    .item:first-child { border-top: 0; }
    .item-body { display: grid; gap: 2px; min-width: 0; }
    .item-body a { font-weight: 500; text-decoration: none; word-break: break-word; }
    .item-body a:hover { text-decoration: underline; }
    .none { padding: 12px 16px; }
    @media (max-width: 560px) { .add-form .two { grid-template-columns: minmax(0, 1fr); } }
  </style>
</head>
<body>
  <main class="wl">
    <header class="wl-head">
      <div class="brand sm"><div class="candles" aria-hidden="true"><i class="lit"></i><i class="lit"></i><i class="lit"></i><i class="lit"></i><i class="lit shamash"></i><i></i><i></i><i></i><i></i></div><span class="brand-name">Secret Macabi</span></div>
      <h1 id="eventTitle">Wish Lists</h1>
      <p id="eventMeta" class="muted"></p>
    </header>

    <div id="status"></div>

    <section id="listCard" hidden>
      <div class="lists" id="wishList"></div>
    </section>
  </main>

  <footer class="site-footer">© 2026 The Party Team</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/dist/umd/supabase.js"></script>
  <script src="config.js?v=15"></script>
  <script>
  (function () {
    "use strict";
    const cfg = window.SECRET_MACABI_CONFIG || {};
    const $ = (id) => document.getElementById(id);
    const params = new URLSearchParams(window.location.search);
    const token = params.get("f");
    const KEYS = "secret-macabi-wish-keys";
    const ME = "secret-macabi-me-" + token;

    const esc = (v) => String(v == null ? "" : v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const safeLink = (v) => /^https?:\/\//i.test(v || "") ? v : "";
    function getKeys() { try { return JSON.parse(localStorage.getItem(KEYS)) || {}; } catch (e) { return {}; } }
    function setKeys(k) { try { localStorage.setItem(KEYS, JSON.stringify(k)); } catch (e) {} }
    function status(text, kind) { $("status").innerHTML = text ? '<div class="banner ' + (kind || "gold") + '">' + esc(text) + "</div>" : ""; }

    if (!token || !/^[0-9a-f-]{36}$/i.test(token)) { status("Use the wish list link from your email or organizer."); return; }
    if (!window.supabase || /YOUR-/.test(cfg.supabaseUrl + cfg.supabaseAnonKey)) { status("Site not configured.", "bad"); return; }

    // Uses the organizer's saved login (if any) from the admin page, so admins can remove any item.
    const sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
    let data = null;
    let isAdmin = null;   // null = not checked yet

    async function checkAdmin() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) return false;
      // Database rules only return this family if the signed-in user is one of its admins.
      const { data: fam } = await sb.from("families").select("id").eq("share_token", token).maybeSingle();
      return !!fam;
    }
    const openIds = new Set([params.get("open"), params.get("me")].filter(Boolean));

    async function load() {
      const { data: result, error } = await sb.rpc("wishlist_get", { p_token: token });
      if (error) { status(error.message, "bad"); return; }
      if (!result) { status("This link has expired. Ask your organizer for the new one.", "bad"); return; }
      data = result;
      if (isAdmin === null) isAdmin = await checkAdmin().catch(() => false);
      status("");
      $("eventTitle").textContent = data.family.name;
      document.title = data.family.name + " · Wish Lists";
      $("eventMeta").textContent = [data.family.occasion, data.family.budget && "Budget " + data.family.budget,
        isAdmin && "Organizer view: you can delete any item"].filter(Boolean).join(" · ");
      renderList();
      $("listCard").hidden = false;
    }

    let addingFor = null;
    function myId() {
      const fromLink = params.get("me");
      if (fromLink) return fromLink;
      try { return localStorage.getItem(ME); } catch (e) { return null; }
    }

    function addFormHtml(memberId, name) {
      return '<form class="add-form" data-member="' + esc(memberId) + '">' +
        '<div class="two">' +
          '<label><span>Item</span><input name="title" maxlength="200" required></label>' +
          '<label><span>Link <span class="muted">(optional)</span></span><input name="link" type="url" maxlength="2000" placeholder="https://"></label>' +
        '</div>' +
        '<label><span>Notes <span class="muted">(optional)</span></span><textarea name="notes" maxlength="1000" placeholder="Size, color…"></textarea></label>' +
        '<div class="actions"><button type="button" class="ghost" data-act="cancel">Cancel</button>' +
        '<button type="submit" class="primary">Add to ' + esc(name) + "'s list</button></div></form>";
    }

    function renderList() {
      const keys = getKeys();
      const me = myId();
      const list = $("wishList");
      if (!data.members.length) { list.innerHTML = '<p class="none muted">No one added yet.</p>'; return; }
      list.innerHTML = data.members.map((m) => {
        const items = data.items.filter((i) => i.member_id === m.id);
        const body = items.length ? '<ul class="items">' + items.map((item) => {
          const link = safeLink(item.link);
          return '<li class="item"><div class="item-body">' +
            (link ? '<a href="' + esc(link) + '" target="_blank" rel="noopener noreferrer">' + esc(item.title) + " ↗</a>" : "<span>" + esc(item.title) + "</span>") +
            (item.notes ? '<span class="muted">' + esc(item.notes) + "</span>" : "") + "</div>" +
            (keys[item.id] || isAdmin ? '<button type="button" class="link danger remove" data-id="' + esc(item.id) + '">Delete</button>' : "") +
            "</li>";
        }).join("") + "</ul>" : '<p class="none muted">Nothing yet.</p>';
        const foot = addingFor === m.id
          ? addFormHtml(m.id, m.name)
          : '<div class="list-foot"><button type="button" class="link" data-act="add" data-member="' + esc(m.id) + '">+ Add item</button></div>';
        return '<details class="list-person"' + (openIds.has(m.id) ? " open" : "") + ' data-member="' + esc(m.id) + '">' +
          "<summary><span>" + esc(m.name) + (m.id === me ? '<span class="you">(you)</span>' : "") +
          '</span><span class="tag">' + items.length + "</span></summary>" + body + foot + "</details>";
      }).join("");
      const input = list.querySelector('.add-form input[name="title"]');
      if (input) input.focus();
    }

    $("wishList").addEventListener("toggle", (e) => {
      const d = e.target.closest && e.target.closest("details");
      if (d) { if (d.open) openIds.add(d.dataset.member); else openIds.delete(d.dataset.member); }
    }, true);

    $("wishList").addEventListener("click", (event) => {
      const button = event.target.closest("[data-act]");
      if (!button) return;
      if (button.dataset.act === "add") { addingFor = button.dataset.member; openIds.add(addingFor); renderList(); }
      if (button.dataset.act === "cancel") { addingFor = null; renderList(); }
    });

    $("wishList").addEventListener("submit", async (event) => {
      const form = event.target.closest(".add-form");
      if (!form) return;
      event.preventDefault();
      const member = form.dataset.member;
      const title = form.title.value.trim();
      if (!title) return;
      const button = form.querySelector("button[type=submit]");
      button.disabled = true;
      const { data: added, error } = await sb.rpc("wishlist_add", {
        p_token: token, p_member: member, p_title: title,
        p_link: form.link.value.trim(), p_notes: form.notes.value.trim()
      });
      button.disabled = false;
      if (error) { status(/wishlist_items_link_check/.test(error.message) ? "Links must start with https://" : error.message, "bad"); return; }
      const keys = getKeys(); keys[added.id] = added.edit_key; setKeys(keys);
      if (!params.get("me")) { try { localStorage.setItem(ME, member); } catch (e) {} }
      addingFor = null;
      status("");
      await load();
    });

    $("wishList").addEventListener("click", async (event) => {
      const button = event.target.closest(".remove");
      if (!button || !confirm("Delete this item?")) return;
      const keys = getKeys();
      const id = button.dataset.id;
      const { error } = keys[id]
        ? await sb.rpc("wishlist_delete", { p_token: token, p_item: id, p_edit_key: keys[id] })
        : await sb.from("wishlist_items").delete().eq("id", id);   // organizer: allowed by database rules
      if (error) { status(error.message, "bad"); return; }
      delete keys[button.dataset.id]; setKeys(keys);
      await load();
    });

    load();
  })();
  </script>
</body>
</html>
