<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Secret Macabi Wish List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">
  <style>
    .wishlist-shell {
      max-width: 760px;
      margin: 0 auto;
      padding: 32px 16px 64px;
      display: grid;
      gap: 20px;
    }
    .wishlist-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 20px;
      display: grid;
      gap: 18px;
    }
    .wish-form {
      display: grid;
      gap: 12px;
    }
    .wish-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 12px;
    }
    .wish-person-group {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--bg);
      overflow: hidden;
    }
    .wish-person-group summary {
      list-style: none;
      cursor: pointer;
      padding: 14px 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .wish-person-group summary::-webkit-details-marker { display: none; }
    .wish-person-group .person-count {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .wish-person-items {
      list-style: none;
      margin: 0;
      padding: 0 16px 16px;
      display: grid;
      gap: 12px;
    }
    .wish-item {
      display: grid;
      gap: 8px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255,255,255,0.72);
    }
    .wish-item .meta {
      color: var(--muted);
      font-size: 13px;
    }
    .wish-item a {
      color: var(--accent);
      text-decoration: none;
    }
    .wish-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <div class="wishlist-shell">
    <header class="topbar">
      <div class="brand">
        <div class="candles" aria-hidden="true">
          <i class="lit"></i><i class="lit"></i><i class="lit"></i><i class="lit"></i>
          <i class="lit shamash"></i><i></i><i></i><i></i><i></i>
        </div>
        <h1 id="eventTitle">Wish List</h1>
      </div>
    </header>

    <div id="status"></div>

    <div class="wishlist-card" id="addCard" hidden>
      <p id="intro" class="lede"></p>
      <form class="wish-form" id="wishForm">
        <label><span>Who are you?</span><select id="wishPerson" required></select></label>
        <label><span>Item</span><input id="wishName" type="text" maxlength="200" placeholder="A nice holiday gift" required></label>
        <label><span>Link (optional)</span><input id="wishLink" type="url" maxlength="2000" placeholder="https://..."></label>
        <label><span>Notes (optional)</span><textarea id="wishNotes" maxlength="1000" placeholder="Size, color, etc."></textarea></label>
        <div class="row"><button type="submit" class="primary">Add to my list</button></div>
      </form>
    </div>

    <section class="wishlist-card" id="listCard" hidden>
      <h2>Everyone's lists</h2>
      <ul id="wishList" class="wish-list"></ul>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script>
  (function () {
    "use strict";
    const cfg = window.SECRET_MACABI_CONFIG || {};
    const $ = (id) => document.getElementById(id);
    const params = new URLSearchParams(window.location.search);
    const token = params.get("f");
    const KEYS = "secret-macabi-wish-keys";
    const ME = "secret-macabi-me-" + token;

    const esc = (v) => String(v == null ? "" : v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const safeLink = (v) => /^https?:\/\//i.test(v || "") ? v : "";
    function getKeys() { try { return JSON.parse(localStorage.getItem(KEYS)) || {}; } catch (e) { return {}; } }
    function setKeys(k) { try { localStorage.setItem(KEYS, JSON.stringify(k)); } catch (e) {} }
    function status(html, kind) { $("status").innerHTML = html ? '<div class="banner ' + (kind || "gold") + '"><span>' + html + "</span></div>" : ""; }

    if (!token || !/^[0-9a-f-]{36}$/i.test(token)) {
      status("This page needs your family's wish-list link. Ask your organizer for it, or use the link in your Secret Macabi email.");
      return;
    }
    if (!window.supabase || /YOUR-/.test(cfg.supabaseUrl + cfg.supabaseAnonKey)) { status("The site isn't connected to its database yet.", "bad"); return; }

    const sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, { auth: { persistSession: false } });
    let data = null;
    const openIds = new Set([params.get("open"), params.get("me")].filter(Boolean));

    async function load() {
      const { data: result, error } = await sb.rpc("wishlist_get", { p_token: token });
      if (error) { status(esc(error.message), "bad"); return; }
      if (!result) { status("This wish-list link is no longer valid. Ask your organizer for the current one.", "bad"); return; }
      data = result;
      status("");
      $("eventTitle").textContent = data.family.name + " Wish List";
      document.title = data.family.name + " Wish List";
      $("intro").textContent = "Add a few ideas for your " + (data.family.occasion || "gift exchange") +
        (data.family.budget ? " (budget " + data.family.budget + ")" : "") + ".";
      renderPeople();
      renderList();
      $("addCard").hidden = false;
      $("listCard").hidden = false;
    }

    function renderPeople() {
      const select = $("wishPerson");
      const current = select.value || params.get("me") || (function () { try { return localStorage.getItem(ME); } catch (e) { return null; } })() || "";
      select.innerHTML = '<option value="">Choose your name…</option>' +
        data.members.map((m) => '<option value="' + esc(m.id) + '">' + esc(m.name) + "</option>").join("");
      if (data.members.some((m) => m.id === current)) select.value = current;
    }

    function renderList() {
      const keys = getKeys();
      const list = $("wishList");
      if (!data.members.length) { list.innerHTML = '<li class="wish-item">Nobody has been added to this family yet.</li>'; return; }
      list.innerHTML = data.members.map((m) => {
        const items = data.items.filter((i) => i.member_id === m.id);
        const body = items.length ? items.map((item) => {
          const link = safeLink(item.link);
          return '<li class="wish-item">' +
            (link ? '<a href="' + esc(link) + '" target="_blank" rel="noopener noreferrer">' + esc(item.title) + " ↗</a>" : "<strong>" + esc(item.title) + "</strong>") +
            (item.notes ? '<div class="meta">' + esc(item.notes) + "</div>" : "") +
            (keys[item.id] ? '<div class="wish-actions"><button type="button" class="remove" data-id="' + esc(item.id) + '">Delete</button></div>' : "") +
            "</li>";
        }).join("") : '<li class="meta">No items yet.</li>';
        return '<details class="wish-person-group"' + (openIds.has(m.id) ? " open" : "") + ' data-member="' + esc(m.id) + '">' +
          "<summary><span>" + esc(m.name) + '</span><span class="person-count">' + items.length + " item" + (items.length === 1 ? "" : "s") + "</span></summary>" +
          '<ul class="wish-person-items">' + body + "</ul></details>";
      }).join("");
    }

    $("wishList").addEventListener("toggle", (e) => {
      const d = e.target.closest && e.target.closest("details");
      if (d) { if (d.open) openIds.add(d.dataset.member); else openIds.delete(d.dataset.member); }
    }, true);

    $("wishForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const member = $("wishPerson").value;
      const title = $("wishName").value.trim();
      if (!member || !title) return;
      const button = event.target.querySelector("button[type=submit]");
      button.disabled = true;
      const { data: added, error } = await sb.rpc("wishlist_add", {
        p_token: token, p_member: member, p_title: title,
        p_link: $("wishLink").value.trim(), p_notes: $("wishNotes").value.trim()
      });
      button.disabled = false;
      if (error) { status(esc(/wishlist_items_link_check/.test(error.message) ? "Links must start with http:// or https://" : error.message), "bad"); return; }
      const keys = getKeys(); keys[added.id] = added.edit_key; setKeys(keys);
      try { localStorage.setItem(ME, member); } catch (e) {}
      openIds.add(member);
      $("wishName").value = ""; $("wishLink").value = ""; $("wishNotes").value = "";
      $("wishName").focus();
      await load();
    });

    $("wishList").addEventListener("click", async (event) => {
      const button = event.target.closest(".remove");
      if (!button || !confirm("Delete this item?")) return;
      const keys = getKeys();
      const { error } = await sb.rpc("wishlist_delete", { p_token: token, p_item: button.dataset.id, p_edit_key: keys[button.dataset.id] });
      if (error) { status(esc(error.message), "bad"); return; }
      delete keys[button.dataset.id]; setKeys(keys);
      await load();
    });

    load();
  })();
  </script>
</body>
</html>
