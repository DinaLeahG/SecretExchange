<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Secret Macabi Wish List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
  <style>
    .wishlist-shell {
      max-width: 760px;
      margin: 0 auto;
      padding: 32px 16px 64px;
      display: grid;
      gap: 20px;
    }
    .wishlist-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 20px;
      display: grid;
      gap: 18px;
    }
    .wish-form {
      display: grid;
      gap: 12px;
    }
    .wish-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 12px;
    }
    .wish-person-group {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--bg);
      overflow: hidden;
    }
    .wish-person-group summary {
      list-style: none;
      cursor: pointer;
      padding: 14px 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .wish-person-group summary::-webkit-details-marker { display: none; }
    .wish-person-group .person-count {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .wish-person-items {
      list-style: none;
      margin: 0;
      padding: 0 16px 16px;
      display: grid;
      gap: 12px;
    }
    .wish-item {
      display: grid;
      gap: 8px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255,255,255,0.72);
    }
    .wish-item .meta {
      color: var(--muted);
      font-size: 13px;
    }
    .wish-item a {
      color: var(--accent);
      text-decoration: none;
    }
    .wish-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <div class="wishlist-shell">
    <header class="topbar">
      <div class="brand">
        <div class="candles" aria-hidden="true">
          <i class="lit"></i><i class="lit"></i><i class="lit"></i><i class="lit"></i>
          <i class="lit shamash"></i><i></i><i></i><i></i><i></i>
        </div>
        <h1 id="eventTitle">Secret Macabi Wish List</h1>
      </div>
      <nav class="topnav" aria-label="Main navigation">
        <a href="index.html">Back</a>
      </nav>
    </header>

    <div class="wishlist-card">
      <p id="intro" class="lede">Add a few thoughtful ideas or shopping links for the exchange.</p>

      <form class="wish-form" id="wishForm">
        <label><span>Person's name</span><input id="wishPerson" type="text" placeholder="Dina" required></label>
        <label><span>Item</span><input id="wishName" type="text" placeholder="A nice holiday gift" required></label>
        <label><span>Link (optional)</span><input id="wishLink" type="url" placeholder="https://..."></label>
        <label><span>Notes (optional)</span><textarea id="wishNotes" placeholder="Size, color, budget, etc."></textarea></label>
        <div class="row">
          <button type="submit" class="primary">Add item</button>
          <button id="clearList" type="button" class="ghost">Clear this person's list</button>
        </div>
      </form>
    </div>

    <section class="wishlist-card">
      <h2>Wishlist</h2>
      <ul id="wishList" class="wish-list"></ul>
    </section>
  </div>

  <script>
    const STORAGE_KEY = "secret-macabi-wishlist-items";

    function itemId() {
      return (Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10));
    }

    function loadItems() {
      try {
        const items = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        return items.map((item) => ({ ...item, id: item.id || itemId() }));
      } catch (e) {
        return [];
      }
    }

    function saveItems(items) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    }

    function normalizeName(name) {
      return String(name || "").trim().replace(/\s+/g, " ");
    }

    function escapeHtml(value) {
      return String(value || "").replace(/[&<>"']/g, (char) => {
        return {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        }[char];
      });
    }

    function titleFromQuery() {
      const params = new URLSearchParams(window.location.search);
      const eventName = params.get("event");
      return eventName ? eventName + " Wish List" : "Secret Macabi Wish List";
    }

    function personFromQuery() {
      const params = new URLSearchParams(window.location.search);
      return normalizeName(params.get("person") || "");
    }

    function groupedItems() {
      const items = loadItems();
      const groups = {};
      items.forEach((item) => {
        const person = normalizeName(item.person || "");
        if (!person) return;
        if (!groups[person]) groups[person] = [];
        groups[person].push(item);
      });
      return Object.keys(groups).sort().map((person) => ({ person, items: groups[person] }));
    }

    function renderList() {
      const list = document.getElementById("wishList");
      const groups = groupedItems();
      const selectedPerson = normalizeName(document.getElementById("wishPerson").value || personFromQuery());
      list.innerHTML = "";

      if (!groups.length) {
        const emptyLabel = selectedPerson ? selectedPerson + " has not added anything yet." : "No wishlist items yet.";
        list.innerHTML = '<li class="wish-item"><strong>No wishlist items yet.</strong><div class="meta">' + escapeHtml(emptyLabel) + '</div></li>';
        return;
      }

      groups.forEach(({ person, items }) => {
        const details = document.createElement("details");
        details.className = "wish-person-group";
        details.open = selectedPerson ? normalizeName(person) === selectedPerson : false;

        const summary = document.createElement("summary");
        summary.innerHTML = '<span>' + escapeHtml(person) + '</span><span class="person-count">' + items.length + ' item' + (items.length === 1 ? '' : 's') + '</span>';

        const ul = document.createElement("ul");
        ul.className = "wish-person-items";

        items.forEach((item) => {
          const li = document.createElement("li");
          li.className = "wish-item";

          const title = item.link
            ? '<a href="' + escapeHtml(item.link) + '" target="_blank" rel="noopener">' + escapeHtml(item.name) + '</a>'
            : '<strong>' + escapeHtml(item.name) + '</strong>';

          const noteHtml = item.notes ? '<div class="meta">' + escapeHtml(item.notes) + '</div>' : "";
          const linkHtml = item.link ? '<div class="meta"><a href="' + escapeHtml(item.link) + '" target="_blank" rel="noopener">Open link</a></div>' : "";

          li.innerHTML = `
            ${title}
            ${noteHtml}
            ${linkHtml}
            <div class="wish-actions">
              <button type="button" class="remove" data-id="${escapeHtml(item.id || itemId())}">Delete</button>
            </div>
          `;

          ul.appendChild(li);
        });

        details.appendChild(summary);
        details.appendChild(ul);
        list.appendChild(details);
      });
    }

    const queryPerson = personFromQuery();
    const personInput = document.getElementById("wishPerson");
    if (queryPerson) {
      personInput.value = queryPerson;
    }

    document.getElementById("eventTitle").textContent = titleFromQuery();
    document.getElementById("intro").textContent = "Pick a few thoughtful options or add a link to a gift you would love to receive.";

    personInput.addEventListener("input", () => {
      renderList();
    });

    document.getElementById("wishForm").addEventListener("submit", (event) => {
      event.preventDefault();

      const person = normalizeName(personInput.value || personFromQuery());
      const name = document.getElementById("wishName").value.trim();
      const link = document.getElementById("wishLink").value.trim();
      const notes = document.getElementById("wishNotes").value.trim();

      if (!person || !name) return;

      const items = loadItems();
      items.push({ id: itemId(), person, name, link, notes });
      saveItems(items);
      renderList();

      event.target.reset();
      personInput.value = person;
      document.getElementById("wishName").focus();
    });

    document.getElementById("wishList").addEventListener("click", (event) => {
      const btn = event.target.closest(".remove");
      if (!btn) return;

      const id = btn.dataset.id;
      const allItems = loadItems();
      const updated = allItems.filter((item) => item.id !== id);
      saveItems(updated);
      renderList();
    });

    document.getElementById("clearList").addEventListener("click", () => {
      const currentPerson = normalizeName(personInput.value || personFromQuery());
      if (!currentPerson) return;

      if (confirm("Clear this person's wishlist?")) {
        const items = loadItems().filter((item) => normalizeName(item.person) !== currentPerson);
        saveItems(items);
        renderList();
      }
    });

    renderList();
  </script>
</body>
</html>
