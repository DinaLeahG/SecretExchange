<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Secret Macabi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css?v=7">
</head>
<body>
  <div id="globalMsg" class="toast" role="status" hidden></div>

  <!-- Sign in -->
  <div id="authView" class="center-view" hidden>
    <div class="card narrow">
      <div class="brand lg"><div class="candles" aria-hidden="true"><i class="lit"></i><i class="lit"></i><i class="lit"></i><i class="lit"></i><i class="lit shamash"></i><i></i><i></i><i></i><i></i></div><span class="brand-name">Secret Macabi</span></div>
      <h1 class="card-title">Sign in</h1>
      <form id="authForm" class="stack">
        <label><span>Email</span><input id="authEmail" type="email" autocomplete="email" required></label>
        <label><span>Password</span><input id="authPassword" type="password" autocomplete="current-password" minlength="8" required></label>
        <button type="submit" class="primary block">Sign in</button>
      </form>
      <p id="authMsg" class="form-msg" role="status"></p>
      <div class="card-links">
        <button type="button" id="signUpBtn" class="link">Create account</button>
        <button type="button" id="forgotBtn" class="link">Forgot password?</button>
      </div>
    </div>
  </div>

  <!-- Choose family -->
  <div id="familyView" class="center-view" hidden>
    <div class="card narrow">
      <div class="brand lg"><div class="candles" aria-hidden="true"><i class="lit"></i><i class="lit"></i><i class="lit"></i><i class="lit"></i><i class="lit shamash"></i><i></i><i></i><i></i><i></i></div><span class="brand-name">Secret Macabi</span></div>
      <h1 class="card-title">Your families</h1>
      <div id="familyList" class="family-list"></div>
      <form id="newFamilyForm" class="inline-form">
        <input id="newFamilyName" placeholder="New family name" maxlength="100" required aria-label="New family name">
        <button type="submit">Create</button>
      </form>
      <div class="card-links">
        <span id="whoAmI" class="muted"></span>
        <button type="button" class="link" data-act="signout">Sign out</button>
      </div>
    </div>
  </div>

  <!-- Admin app -->
  <div id="appView" hidden>
    <header class="appbar">
      <div class="appbar-inner">
        <div class="appbar-title">
          <div class="brand sm"><div class="candles" aria-hidden="true"><i class="lit"></i><i class="lit"></i><i class="lit"></i><i class="lit"></i><i class="lit shamash"></i><i></i><i></i><i></i><i></i></div><span class="brand-name">Secret Macabi</span></div>
          <span id="familyTitle" class="family-name"></span>
        </div>
        <div class="appbar-actions">
          <span id="saveState" class="save-state" aria-live="polite"></span>
          <a id="wishlistNav" class="link" href="wishlist.html" target="_blank" rel="noopener">Wish lists ↗</a>
          <button type="button" id="switchFamily" class="link">Switch</button>
          <button type="button" class="link" data-act="signout">Sign out</button>
        </div>
      </div>
      <nav class="tabs" role="tablist">
        <button type="button" role="tab" data-tab="people" class="tab active">People</button>
        <button type="button" role="tab" data-tab="draw" class="tab">Draw</button>
        <button type="button" role="tab" data-tab="settings" class="tab">Settings</button>
      </nav>
    </header>

    <main class="page">
      <!-- People -->
      <section data-panel="people" class="panel">
        <div class="panel-head">
          <h2>People <span class="count" id="counts"></span></h2>
          <label class="file-btn">Import list<input id="peopleFile" type="file" accept=".txt,.csv,text/plain" hidden></label>
        </div>

        <form id="addPersonForm" class="add-row">
          <input id="newName" maxlength="100" placeholder="Name" required aria-label="Name">
          <input id="newEmail" type="email" placeholder="Email" aria-label="Email">
          <select id="newGroup" aria-label="Group"><option>Adults</option><option>Kids</option></select>
          <button type="submit" class="primary">Add</button>
        </form>

        <div class="people" id="people"></div>
      </section>

      <!-- Draw -->
      <section data-panel="draw" class="panel" hidden>
        <div class="panel-head">
          <h2>Draw</h2>
          <div class="row" id="drawControls"></div>
        </div>
        <div id="drawMsg"></div>
        <div class="results" id="results"></div>
      </section>

      <!-- Settings -->
      <section data-panel="settings" class="panel" hidden>
        <div class="settings-block">
          <h3>Event</h3>
          <div class="grid-2">
            <label><span>Name</span><input data-setting="name" maxlength="100" placeholder="Rosen Family Exchange"></label>
            <label><span>Budget</span><input data-setting="budget" maxlength="50" placeholder="$25"></label>
            <label><span>Occasion</span><input data-setting="occasion" maxlength="100" placeholder="Chanukah party, Dec 20"></label>
            <label><span>Email sign-off</span><input data-setting="signoff" maxlength="100" placeholder="Love, Aunt Miriam"></label>
            <label class="wide"><span>Email subject</span><input data-setting="email_subject" maxlength="200" placeholder="{name}, your Secret Macabi match is here"></label>
            <label><span>Skip matches from last</span>
              <select data-setting="avoid_recent_draws">
                <option value="0">No restriction</option>
                <option value="1">1 draw</option>
                <option value="2">2 draws</option>
                <option value="3">3 draws</option>
              </select></label>
          </div>
        </div>

        <div class="settings-block">
          <h3>Wish list link</h3>
          <div class="inline-form">
            <input id="shareLink" readonly aria-label="Wish list link">
            <button id="copyShare" type="button">Copy</button>
          </div>
          <div class="row">
            <button id="testEmail" type="button" class="link">Send test email</button>
            <button id="regenShare" type="button" class="link danger">Reset link</button>
          </div>
        </div>

        <div class="settings-block">
          <h3>Admins</h3>
          <div id="adminList" class="admin-list"></div>
          <form id="addAdminForm" class="inline-form" hidden>
            <input id="adminEmail" type="email" placeholder="Email of someone with an account" required aria-label="Admin email">
            <select id="adminRole" aria-label="Role"><option value="admin">Admin</option><option value="owner">Owner</option></select>
            <button type="submit">Add</button>
          </form>
        </div>

        <details class="settings-block">
          <summary><h3>Past draws <span class="count" id="pastCount"></span></h3></summary>
          <p class="muted">One per line: <code>Giver - Receiver</code>. Saved pairs won't repeat.</p>
          <textarea id="historyText" placeholder="Leah Rosen - Ben&#10;Ben Rosen - Noa"></textarea>
          <div class="row">
            <button id="applyHistory" type="button" class="primary">Save</button>
            <label class="file-btn">Upload file<input id="historyFile" type="file" accept=".txt,.csv,text/plain" multiple hidden></label>
            <span class="muted" id="historyMsg"></span>
          </div>
          <div id="pastList" class="past-list"></div>
        </details>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/dist/umd/supabase.js"></script>
  <script src="config.js?v=4"></script>
  <script src="app.js?v=7"></script>
</body>
</html>
